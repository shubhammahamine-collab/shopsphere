name: ShopSphere CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore ShopSphere.slnx

      - name: Build solution
        run: dotnet build ShopSphere.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/ShopSphere.UnitTests/ShopSphere.UnitTests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
